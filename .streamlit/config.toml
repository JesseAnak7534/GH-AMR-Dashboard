[logger]
level = "info"

[client]
showErrorDetails = true
# Prevent toolbar from being hidden which can affect data persistence
toolbarMode = "viewer"

[server]
# Prevent server from closing idle connections
maxUploadSize = 200
maxMessageSize = 200
runOnSave = false
# Critical: keep connections alive
enableCORS = false
enableWebsocketCompression = true
headless = true

[runner]
magicEnabled = true
# Faster reruns reduce perceived lag
fastReruns = true

[theme]
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"
