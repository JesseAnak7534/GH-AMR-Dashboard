[logger]
level = "info"

[client]
showErrorDetails = true
# Prevent toolbar from being hidden which can affect data persistence
toolbarMode = "viewer"

[server]
maxUploadSize = 200
maxMessageSize = 200
runOnSave = false
# Local development: both CORS + XSRF must be false OR both true.
# Setting enableCORS=false while XSRF stays on makes Streamlit force it
# back to true and then block localhost's WebSocket because
# http://localhost:8501 is not in the default allowedOrigins list —
# the app shell loads but the page stays blank. Both off is the
# supported combo for local dev. Re-enable both on production deploy.
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = true
headless = true

[runner]
magicEnabled = true
fastReruns = true

[theme]
# Warm editorial palette, mirrors the CSS tokens in app.py so the
# initial paint matches the custom shell instead of flashing white.
base = "light"
primaryColor = "#1d4d43"
backgroundColor = "#f3ead6"
secondaryBackgroundColor = "#fdfaf2"
textColor = "#1a170e"
font = "sans serif"
